global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/search-alerts.yml

scrape_configs:
  - job_name: service-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["service-ai:8000"]

  - job_name: spring-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-api:8080"]
