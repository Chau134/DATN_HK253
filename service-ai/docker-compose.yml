services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Reuse the repository-local index populated by the evaluation/reindex
      # scripts. A separate named volume starts empty and makes text search
      # fail with "collection does not exist".
      - ${QDRANT_STORAGE_PATH:-../qdrant_storage}:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      # Existing collections can take over a minute to recover from the
      # bind-mounted storage. Do not mark Qdrant unhealthy while it is still
      # performing that normal startup recovery.
      start_period: 180s
      retries: 10

  service-ai:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override so the container reaches Qdrant by service name, not localhost.
      QDRANT_URL: http://qdrant:6333
      # Initialize managed clients and warm explicitly enabled local components
      # before /health/ready turns green.
      PRELOAD_MODELS: "true"
      COHERE_EMBEDDING_MODEL_NAME: ${COHERE_EMBEDDING_MODEL_NAME:-embed-v4.0}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      BEDROCK_EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS: ${BEDROCK_EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS:-1}
      BEDROCK_EMBEDDING_THROTTLE_RETRY_ATTEMPTS: "6"
      BEDROCK_EMBEDDING_THROTTLE_BACKOFF_SECONDS: "2"
      BEDROCK_EMBEDDING_THROTTLE_MAX_BACKOFF_SECONDS: "30"
      # Short-term Bedrock API keys only work in the Region where they were generated.
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-northeast-1}
      # Forward a Bedrock API key from the current shell or .env. Do not alias
      # an ABSK key to the IAM access-key variables.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      QDRANT_TEXT_COLLECTION: ${QDRANT_TEXT_COLLECTION:-product_text_vectors_cohere_embed_v4_1536_metadata_v4_100_products}
      QDRANT_IMAGE_COLLECTION: ${QDRANT_IMAGE_COLLECTION:-product_image_vectors_cohere_embed_v4_1536_100_products}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-project-7a5551d7-985f-4ecc-985}
      GOOGLE_CLOUD_RERANKER_ACCESS_TOKEN_FILE: /var/run/secrets/google/reranker-access-token
      # Default to the validated retrieval baseline; set RERANK_ENABLED=true
      # explicitly for the P4 A/B run.
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      ASSISTANT_EVALUATION_VARIANT: ${ASSISTANT_EVALUATION_VARIANT:-rag}
      YOLO_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./.secrets/reranker-access-token:/var/run/secrets/google/reranker-access-token:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
