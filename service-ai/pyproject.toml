[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecommerce-search-assistant"
version = "0.1.0"
description = "FastAPI skeleton for an AI ecommerce search assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "google-cloud-discoveryengine>=0.20.1",
  "google-genai>=1.0.0",
  "httpx>=0.28.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.5",
  "langgraph-checkpoint-redis>=0.4.1",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "Pillow>=11.0.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "qdrant-client>=1.14.0",
  "redis>=5.2.0",
  "starlette>=0.46.0,<1.0.0",
  # Keep the AWS SDK pair reproducible at the version verified by this service.
  "boto3==1.43.47",
  "botocore==1.43.47",
  "cohere>=5.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "torch>=2.6.0",
]
local-models = [
  "accelerate>=1.0.0",
  "open_clip_torch>=2.24.0",
  "sentencepiece>=0.2.0",
  "sentence-transformers>=5.4.0",
  "torch>=2.6.0",
  "transformers>=4.57.0",
  "ultralytics>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
