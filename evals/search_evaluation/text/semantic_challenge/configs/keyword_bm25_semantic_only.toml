schema_version = 'semantic-only-v1'
algorithm = 'bm25_field_weighted'
description = 'Frozen BM25 baseline evaluated on reviewed semantic variants.'

[paths]
products_csv = '../../data/product_snapshot.csv'
query_set_csv = '../data/text_queries_semantic_only_v1.csv'
ground_truth_csv = '../data/ground_truth_text_semantic_only_v1.csv'
results_csv = '../reports/search_results_keyword_bm25.csv'
run_metadata_json = '../reports/keyword_bm25_run_metadata.json'
metrics_json = '../reports/metrics_keyword_bm25.json'
metrics_csv = '../reports/metrics_keyword_bm25.csv'
comparison_json = '../reports/compare_keyword_vs_vector_no_rerank.json'
comparison_markdown = '../reports/compare_keyword_vs_vector_no_rerank.md'
vector_metrics_json = '../reports/metrics_vector_no_rerank.json'
vector_results_csv = '../reports/search_results_vector_no_rerank.csv'
review_csv = '../review/keyword_vs_vector_result_review.csv'

[ranking]
top_k = 20
k1 = 1.5
b = 0.75
minimum_token_coverage = 0.6
minimum_should_match = 1

[ranking.field_weights]
product_name = 4
category = 3
brand = 2
color = 2
material = 2
gender = 1
price_bucket = 2
usage = 2
description = 1

[evaluation]
k_values = [5, 10, 20]
relevance_threshold = 1
bootstrap_samples = 10000
bootstrap_seed = 42
