schema_version = 'v1'
algorithm = 'bm25_field_weighted'
description = 'Deterministic offline keyword baseline for the Text Search v2 evaluation set.'

[paths]
products_csv = '../../text/data/product_snapshot.csv'
query_set_csv = '../../text/data/text_queries_v2.csv'
ground_truth_csv = '../../text/data/ground_truth_text_v2.csv'
results_csv = '../data/search_results_keyword_bm25.csv'
run_metadata_json = '../reports/keyword_bm25_run_metadata.json'
metrics_json = '../reports/metrics_keyword_bm25.json'
metrics_csv = '../reports/metrics_keyword_bm25.csv'
comparison_json = '../reports/compare_keyword_vs_vector_no_rerank.json'
comparison_markdown = '../reports/compare_keyword_vs_vector_no_rerank.md'
vector_metrics_json = '../../text/reports/metrics_text_v2_20260821-180500_no_rerank_v7_4_final.json'
vector_results_csv = '../../text/reports/search_results_text_v2_20260821-180500_no_rerank_v7_4_final.csv'
review_csv = '../review/keyword_baseline_review.csv'

[ranking]
top_k = 20
k1 = 1.5
b = 0.75
minimum_token_coverage = 0.6
minimum_should_match = 1

[ranking.field_weights]
product_name = 4
category = 3
brand = 2
color = 2
material = 2
gender = 1
price_bucket = 2
usage = 2
description = 1

[evaluation]
k_values = [5, 10, 20]
relevance_threshold = 1
bootstrap_samples = 10000
bootstrap_seed = 42
