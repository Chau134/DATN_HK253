# Full-stack deployment: MySQL + Qdrant + managed-model service-ai + Spring API + frontend.
# Services reach each other by service name on the default compose network.
# Only the frontend (80) and Spring API (8080) are published to the host;
# MySQL, Qdrant and service-ai stay internal.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: DATN
    volumes:
      - mysql_data:/var/lib/mysql
      # Single data-only import file, available inside the container for the one-shot
      # import run AFTER Spring/Hibernate has created the schema (see database/README.md):
      #   docker compose exec -T mysql sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" DATN' < database/data.sql
      - ./database/data.sql:/seed/data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      # Large persisted collections may need more than a minute to recover.
      start_period: 180s
      retries: 10
    restart: unless-stopped

  service-ai:
    build:
      context: ./service-ai
      dockerfile: Dockerfile
    env_file:
      - ./service-ai/.env
    environment:
      # Reach Qdrant by service name, not localhost.
      QDRANT_URL: http://qdrant:6333
      # In the full-stack network, call Spring by service name. The standalone
      # service-ai compose uses host.docker.internal instead.
      SPRINGBOOT_BASE_URL: http://spring-api:8080
      # Managed embedding/ranking; YOLO is temporarily disabled, so no GPU is used.
      PRELOAD_MODELS: "true"
      EMBEDDING_PROVIDER: bedrock
      BEDROCK_EMBEDDING_MODEL_ID: cohere.embed-v4:0
      BEDROCK_EMBEDDING_IMAGE_MAX_SIDE: "512"
      BEDROCK_EMBEDDING_MIN_REQUEST_INTERVAL_SECONDS: "1"
      BEDROCK_EMBEDDING_THROTTLE_RETRY_ATTEMPTS: "6"
      BEDROCK_EMBEDDING_THROTTLE_BACKOFF_SECONDS: "2"
      BEDROCK_EMBEDDING_THROTTLE_MAX_BACKOFF_SECONDS: "30"
      # Short-term Bedrock API keys only work in the Region where they were generated.
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-northeast-1}
      # Forward a Bedrock API key from the current shell or project .env.
      # ABSK keys never belong in the IAM access-key variables.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      QDRANT_TEXT_COLLECTION: product_text_vectors_cohere_embed_v4_1536_metadata_v4_100_products
      QDRANT_IMAGE_COLLECTION: product_image_vectors_cohere_embed_v4_1536_100_products
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-project-7a5551d7-985f-4ecc-985}
      GOOGLE_CLOUD_RERANKER_ACCESS_TOKEN_FILE: /var/run/secrets/google/reranker-access-token
      # Evaluation matrix overrides. Production behavior remains RAG by default.
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      ASSISTANT_EVALUATION_VARIANT: ${ASSISTANT_EVALUATION_VARIANT:-rag}
      YOLO_ENABLED: "false"
    volumes:
      - ./service-ai/.secrets/reranker-access-token:/var/run/secrets/google/reranker-access-token:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  spring-api:
    build:
      context: ./service-api-ecommerce
      dockerfile: Dockerfile
    env_file:
      - ./service-api-ecommerce/.env
    environment:
      # Point at the sibling containers instead of localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/DATN?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
      AI_SERVICE_BASE_URL: http://service-ai:8000
      AI_SERVICE_TIMEOUT_SECONDS: "600"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; set to the VM's public API URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "80:80"
    depends_on:
      - spring-api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/search-alerts.yml:/etc/prometheus/search-alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      service-ai:
        condition: service_healthy
      spring-api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_storage:
  prometheus_data:
  grafana_data:
