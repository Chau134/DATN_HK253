ai:
  service:
    enabled: ${AI_SERVICE_ENABLED:true}
    mock: ${AI_SERVICE_MOCK:false}
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    internal-api-key: ${AI_SERVICE_INTERNAL_API_KEY:change-me}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:30}
    sync:
      batch-size: ${AI_SERVICE_SYNC_BATCH_SIZE:50}
      cron: "${AI_SERVICE_SYNC_CRON:0 */10 * * * *}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
