spring.application.name=service-api-ecommerce
spring.config.import=optional:file:.env[.properties],optional:file:service-api-ecommerce/.env[.properties]

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/DATN?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.cloud.gcp.core.enabled=false

springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.security.jwt.secret=${JWT_SECRET:dev-local-change-this-secret-before-production}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
app.security.rate-limit.auth.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.auth.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
app.security.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

app.auth.password-reset.otp-ttl-minutes=${PASSWORD_RESET_OTP_TTL_MINUTES:10}
app.auth.password-reset.reset-token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
app.auth.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:}

# SMTP only supports password recovery and must not make the commerce API unavailable.
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace

app.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.authorized-redirect-uri=${GOOGLE_OAUTH_AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/callback}
app.oauth2.failure-redirect-uri=${GOOGLE_OAUTH_FAILURE_REDIRECT_URI:http://localhost:5173/login?oauth2_error=google_login_failed}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.avatar-folder=${CLOUDINARY_AVATAR_FOLDER:dacn/avatar}
app.cloudinary.max-avatar-bytes=${CLOUDINARY_MAX_AVATAR_BYTES:5242880}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}
