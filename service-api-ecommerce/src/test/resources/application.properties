spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/DACN_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${TEST_SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${TEST_SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.cloud.gcp.core.enabled=false
app.security.jwt.secret=test-secret-for-isolated-local-test-database-1234567890
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-days=30
app.security.rate-limit.auth.enabled=false
app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=
app.cloudinary.avatar-folder=dacn/avatar
app.cloudinary.max-avatar-bytes=5242880
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
